name: Deploy GitHub Pages

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify sources, routes and evidence boundaries
        run: npm test
      - name: Build static lecture website
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Check exported entry points
        run: test -f out/index.html && test -f out/products/index.html && test ! -d out/api
      - name: Verify public diagrams and attribution
        run: node scripts/verify-longevity-export.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    # The protected github-pages environment permits main deployments only.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
