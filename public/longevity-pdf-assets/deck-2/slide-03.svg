<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">大掃除之前，先整理順序</title><desc id="desc">找到源頭：先照顧住的空間；安排日常：吃飯、喝水與活動；留出休息：規律作息與放鬆；回頭看紀錄：持續追蹤變化。依來源重製的健康教育圖解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10" fill="#A7803D"/></marker></defs><rect width="1600" height="1000" rx="36" fill="#FAF7F2"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK TC','PingFang TC',sans-serif"><text x="800" y="80" text-anchor="middle" font-size="28" fill="#34443B"><tspan x="800" dy="0">房間潮濕有霉味？先把生活環境照顧好</tspan></text><text x="800" y="150" text-anchor="middle" font-size="48" fill="#182220"><tspan x="800" dy="0">大掃除之前，先整理順序</tspan></text><path d="M700 400 L800 500 L900 400 M800 500 L700 610 M800 500 L900 610" fill="none" stroke="#A7803D" stroke-width="4" /><g><rect x="100" y="220" width="600" height="220" rx="30" fill="#1B4D3E" stroke="#1B4D3E" stroke-width="2"/><text x="400" y="300" text-anchor="middle" font-size="38" fill="#FFFFFF"><tspan x="400" dy="0">找到源頭</tspan></text><text x="400" y="375" text-anchor="middle" font-size="29" fill="#FFFFFF"><tspan x="400" dy="0">先照顧住的空間</tspan></text></g><g><rect x="900" y="220" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="300" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">安排日常</tspan></text><text x="1200" y="375" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">吃飯、喝水與活動</tspan></text></g><g><rect x="100" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="400" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="400" dy="0">留出休息</tspan></text><text x="400" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="400" dy="0">規律作息與放鬆</tspan></text></g><g><rect x="900" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">回頭看紀錄</tspan></text><text x="1200" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">持續追蹤變化</tspan></text></g><circle cx="800" cy="500" r="65" fill="#EEE7D9"/><text x="800" y="510" text-anchor="middle" font-size="25" fill="#34443B"><tspan x="800" dy="0">一起理解</tspan></text><path d="M100 870 H1500" stroke="#CDD5CB" stroke-width="2"/><text x="800" y="920" text-anchor="middle" font-size="26" fill="#34443B"><tspan x="800" dy="0">跟著生活中的比喻，一步一步讀懂身體。</tspan></text><text x="800" y="967" text-anchor="middle" font-size="22" fill="#34443B"><tspan x="800" dy="0">依講座資料重製的生活圖解</tspan></text></g></svg>