<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">把飲食與作息，排進同一張清單</title><desc id="desc">餐桌原料：多樣食物各有角色；回收工作：分類、轉換、再利用；日常節奏：吃飯與休息的時間；完整清單：食品、補充品與用藥。依來源重製的健康教育圖解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10" fill="#A7803D"/></marker></defs><rect width="1600" height="1000" rx="36" fill="#FAF7F2"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK TC','PingFang TC',sans-serif"><text x="800" y="80" text-anchor="middle" font-size="28" fill="#34443B"><tspan x="800" dy="0">睡不著、容易緊張？找回身體的生活節奏</tspan></text><text x="800" y="150" text-anchor="middle" font-size="48" fill="#182220"><tspan x="800" dy="0">把飲食與作息，排進同一張清單</tspan></text><g><rect x="100" y="220" width="600" height="220" rx="30" fill="#1B4D3E" stroke="#1B4D3E" stroke-width="2"/><text x="400" y="300" text-anchor="middle" font-size="38" fill="#FFFFFF"><tspan x="400" dy="0">餐桌原料</tspan></text><text x="400" y="375" text-anchor="middle" font-size="29" fill="#FFFFFF"><tspan x="400" dy="0">多樣食物各有角色</tspan></text></g><g><rect x="900" y="220" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="300" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">回收工作</tspan></text><text x="1200" y="375" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">分類、轉換、再利用</tspan></text></g><g><rect x="100" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="400" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="400" dy="0">日常節奏</tspan></text><text x="400" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="400" dy="0">吃飯與休息的時間</tspan></text></g><g><rect x="900" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">完整清單</tspan></text><text x="1200" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">食品、補充品與用藥</tspan></text></g><path d="M100 870 H1500" stroke="#CDD5CB" stroke-width="2"/><text x="800" y="920" text-anchor="middle" font-size="26" fill="#34443B"><tspan x="800" dy="0">把不同角色放在一起，慢慢看懂。</tspan></text><text x="800" y="967" text-anchor="middle" font-size="22" fill="#34443B"><tspan x="800" dy="0">依講座資料重製的生活圖解</tspan></text></g></svg>