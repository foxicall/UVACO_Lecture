<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">發炎之後，還要好好收尾</title><desc id="desc">防禦反應：清除刺激來源；胞葬作用：清除凋亡細胞；收尾與修復：恢復組織穩態；若清除失敗：DAMPs → NLRP3。依來源重製的健康教育圖解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10" fill="#A7803D"/></marker></defs><rect width="1600" height="1000" rx="36" fill="#FAF7F2"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK TC','PingFang TC',sans-serif"><text x="800" y="80" text-anchor="middle" font-size="28" fill="#34443B"><tspan x="800" dy="0">發炎消退與腦部脂質</tspan></text><text x="800" y="150" text-anchor="middle" font-size="48" fill="#182220"><tspan x="800" dy="0">發炎之後，還要好好收尾</tspan></text><path d="M720 330 H875" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><path d="M1200 445 V550" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><path d="M880 680 H725" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><path d="M400 560 V450" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="100" y="220" width="600" height="220" rx="30" fill="#1B4D3E" stroke="#1B4D3E" stroke-width="2"/><text x="400" y="300" text-anchor="middle" font-size="38" fill="#FFFFFF"><tspan x="400" dy="0">防禦反應</tspan></text><text x="400" y="375" text-anchor="middle" font-size="29" fill="#FFFFFF"><tspan x="400" dy="0">清除刺激來源</tspan></text></g><g><rect x="900" y="220" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="300" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">胞葬作用</tspan></text><text x="1200" y="375" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">清除凋亡細胞</tspan></text></g><g><rect x="100" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="400" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="400" dy="0">收尾與修復</tspan></text><text x="400" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="400" dy="0">恢復組織穩態</tspan></text></g><g><rect x="900" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">若清除失敗</tspan></text><text x="1200" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">DAMPs → NLRP3</tspan></text></g><path d="M100 870 H1500" stroke="#CDD5CB" stroke-width="2"/><text x="800" y="920" text-anchor="middle" font-size="26" fill="#34443B"><tspan x="800" dy="0">連線協助理解研究與閱讀順序，不代表個人的因果診斷。</tspan></text><text x="800" y="967" text-anchor="middle" font-size="22" fill="#34443B"><tspan x="800" dy="0">依參考資料重製圖解・不是原始投影片</tspan></text></g></svg>