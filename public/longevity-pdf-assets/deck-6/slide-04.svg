<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">五個小步驟，把腸道照護排好</title><desc id="desc">找出困擾：記錄生活與飲食；檢視需要：了解消化與好菌；照顧花園：把營養與作息排好；回頭調整：追蹤變化再討論。依來源重製的健康教育圖解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10" fill="#A7803D"/></marker></defs><rect width="1600" height="1000" rx="36" fill="#FAF7F2"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK TC','PingFang TC',sans-serif"><text x="800" y="80" text-anchor="middle" font-size="28" fill="#34443B"><tspan x="800" dy="0">把腸道照顧好，讓日子更自在</tspan></text><text x="800" y="150" text-anchor="middle" font-size="48" fill="#182220"><tspan x="800" dy="0">五個小步驟，把腸道照護排好</tspan></text><g><rect x="100" y="220" width="600" height="220" rx="30" fill="#1B4D3E" stroke="#1B4D3E" stroke-width="2"/><text x="400" y="300" text-anchor="middle" font-size="38" fill="#FFFFFF"><tspan x="400" dy="0">找出困擾</tspan></text><text x="400" y="375" text-anchor="middle" font-size="29" fill="#FFFFFF"><tspan x="400" dy="0">記錄生活與飲食</tspan></text></g><g><rect x="900" y="220" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="300" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">檢視需要</tspan></text><text x="1200" y="375" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">了解消化與好菌</tspan></text></g><g><rect x="100" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="400" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="400" dy="0">照顧花園</tspan></text><text x="400" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="400" dy="0">把營養與作息排好</tspan></text></g><g><rect x="900" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">回頭調整</tspan></text><text x="1200" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">追蹤變化再討論</tspan></text></g><path d="M100 870 H1500" stroke="#CDD5CB" stroke-width="2"/><text x="800" y="920" text-anchor="middle" font-size="26" fill="#34443B"><tspan x="800" dy="0">把不同角色放在一起，慢慢看懂。</tspan></text><text x="800" y="967" text-anchor="middle" font-size="22" fill="#34443B"><tspan x="800" dy="0">依講座資料重製的生活圖解</tspan></text></g></svg>