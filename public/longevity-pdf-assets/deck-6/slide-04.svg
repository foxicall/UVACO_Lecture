<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">五個照護方向，因人而異</title><desc id="desc">Remove／Replace：評估誘因與消化；Reinoculate：菌相與纖維；Repair：評估屏障與營養；Rebalance：活動・睡眠・壓力。依來源重製的健康教育圖解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10" fill="#A7803D"/></marker></defs><rect width="1600" height="1000" rx="36" fill="#FAF7F2"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK TC','PingFang TC',sans-serif"><text x="800" y="80" text-anchor="middle" font-size="28" fill="#34443B"><tspan x="800" dy="0">腦腸軸與免疫老化</tspan></text><text x="800" y="150" text-anchor="middle" font-size="48" fill="#182220"><tspan x="800" dy="0">五個照護方向，因人而異</tspan></text><path d="M720 330 H875" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><path d="M1200 445 V550" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><path d="M880 680 H725" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><path d="M400 560 V450" fill="none" stroke="#A7803D" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="100" y="220" width="600" height="220" rx="30" fill="#1B4D3E" stroke="#1B4D3E" stroke-width="2"/><text x="400" y="300" text-anchor="middle" font-size="38" fill="#FFFFFF"><tspan x="400" dy="0">Remove／Replace</tspan></text><text x="400" y="375" text-anchor="middle" font-size="29" fill="#FFFFFF"><tspan x="400" dy="0">評估誘因與消化</tspan></text></g><g><rect x="900" y="220" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="300" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">Reinoculate</tspan></text><text x="1200" y="375" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">菌相與纖維</tspan></text></g><g><rect x="100" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="400" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="400" dy="0">Repair</tspan></text><text x="400" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="400" dy="0">評估屏障與營養</tspan></text></g><g><rect x="900" y="570" width="600" height="220" rx="30" fill="#FFFFFF" stroke="#C5D0C4" stroke-width="2"/><text x="1200" y="650" text-anchor="middle" font-size="38" fill="#182220"><tspan x="1200" dy="0">Rebalance</tspan></text><text x="1200" y="725" text-anchor="middle" font-size="29" fill="#34443B"><tspan x="1200" dy="0">活動・睡眠・壓力</tspan></text></g><path d="M100 870 H1500" stroke="#CDD5CB" stroke-width="2"/><text x="800" y="920" text-anchor="middle" font-size="26" fill="#34443B"><tspan x="800" dy="0">連線協助理解研究與閱讀順序，不代表個人的因果診斷。</tspan></text><text x="800" y="967" text-anchor="middle" font-size="22" fill="#34443B"><tspan x="800" dy="0">依參考資料重製圖解・不是原始投影片</tspan></text></g></svg>